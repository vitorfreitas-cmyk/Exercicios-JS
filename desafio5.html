<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Caixa Eletrônico</title>

    <script>
        // Regra 1 - Quando a página carregar
        window.onload = function () {
            alert("Caixa Eletrônico Pronto. Insira seus dados.");
        }

        // Regra 2 - Detectar digitação da senha
        function detectarDigitacao() {
            console.log("Detectando digitação segura...");
        }

        // Regra 3 - Confirmar operação
        function confirmarOperacao() {
            alert("Processando transação... Por favor, aguarde.");
        }

        // Regra 4 - Avisar antes de sair da página
        window.onbeforeunload = function (event) {
            event.preventDefault();
            event.returnValue = "";
        }
    </script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h3>Caixa Eletrônico</h3>
                    </div>

                    <div class="card-body">

                        <form>

                            <div class="mb-3">
                                <label for="usuario" class="form-label">
                                    Usuário
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="usuario"
                                    placeholder="Digite seu usuário">
                            </div>

                            <div class="mb-3">
                                <label for="senha" class="form-label">
                                    Senha
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="senha"
                                    placeholder="Digite sua senha"
                                    onkeyup="detectarDigitacao()">
                            </div>

                            <div class="d-grid">
                                <button
                                    type="button"
                                    class="btn btn-success"
                                    onclick="confirmarOperacao()">
                                    Confirmar Operação
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
