<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capturamento</title>
</head>
<body>
    <input type="text" id="entrada" onkeypress="mostravalor()">
    <input type="text" id="saida" disabled="disabled">
    <script>
        function mostravalor(){
        var texto = document.getElementById('entrada').value; //capturando o valor
        document.getElementById('saida').value = texto; //enviando o valor
        }
    </script>
    
</body>
</html>
