<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contrato Estudantil</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0d6efd;
}

.container{
    margin-top:20px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.2);
}

textarea{
    resize:none;
}

</style>

</head>
<body>

<div class="container">

<h2 class="text-center mb-4">
CONTRATO ESTUDANTIL
</h2>

<form id="formulario">

<div class="row mb-3">

<div class="col-md-4">
<input type="text" id="nome" class="form-control" placeholder="Nome">
</div>

<div class="col-md-8">
<input type="text" id="sobrenome" class="form-control" placeholder="Sobrenome">
</div>

</div>

<div class="row mb-3">

<div class="col-md-6">
<input type="text" id="cidade" class="form-control" placeholder="Cidade">
</div>

<div class="col-md-2">
<input type="text" id="estado" class="form-control" placeholder="Estado">
</div>

<div class="col-md-2">
<input type="text" id="cep" class="form-control" placeholder="CEP">
</div>

</div>

<div class="form-check mb-3">
<input class="form-check-input" type="radio" id="aceito">
<label class="form-check-label">
Aceito o contrato
</label>
</div>

<button class="btn btn-primary" type="submit">
Enviar
</button>

</form>

<hr>

<label class="form-label">
Contrato
</label>

<textarea id="contrato" class="form-control" rows="8" readonly></textarea>

</div>

<script>

const formulario = document.getElementById("formulario");

formulario.addEventListener("submit", function(e){

    e.preventDefault();

    let nome = document.getElementById("nome").value;
    let sobrenome = document.getElementById("sobrenome").value;
    let cidade = document.getElementById("cidade").value;
    let estado = document.getElementById("estado").value;
    let cep = document.getElementById("cep").value;

    let aceito = document.getElementById("aceito").checked
        ? "Sim"
        : "Não";

    document.getElementById("contrato").value =
`CONTRATO ESTUDANTIL

Nome: ${nome} ${sobrenome}

Cidade: ${cidade}

Estado: ${estado}

CEP: ${cep}

Aceitou o contrato: ${aceito}

Declaro que as informações acima são verdadeiras e concordo com os termos deste contrato.`;

});

</script>

</body>
</html>
