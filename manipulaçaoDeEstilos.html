<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MANIPULAÇÃO DE ESTILO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        .margin{
            margin: 20px;
        }
    </style>
    <script>
        function modificarEtilo(cordefundo){
            document.getElementById('div_cor').style.backgroundColor = cordefundo
        }
    </script>
  </head>
  <body>
    <div class="margin">
        <h2>Manipulação de Estilo</h2>

        <button type="button" onclick="modificarEtilo('#0000FF')" class="btn btn-primary">Azul</button>
        <button type="button" onclick="modificarEtilo('#00FF00')" class="btn btn-success">Verde</button>
        <button type="button" onclick="modificarEtilo('#FF0000')" class="btn btn-danger">Vermelho</button>
        <button type="button" onclick="modificarEtilo('#FFFF00')" class="btn btn-warning">Amarelo</button>
        <hr>
        <div id="div_cor" style="border: solid 1px black; width: 100px; height: 100px;"></div>
    </div>
    








    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
